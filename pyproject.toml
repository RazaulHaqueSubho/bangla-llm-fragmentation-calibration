[project]
name = "bangla-llm-fragmentation-calibration"
version = "0.1.0"
description = "This study aims to investigates the relationship between tokenization fragmentation and confidence calibration in Bangla Large Language Models (LLMs)."
readme = "README.md"
authors = [
    { name = "We_have_a_trust_issue", email = "" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "marimo",
    "datasets",
    "matplotlib",
    "transformers",
    "huggingface_hub",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
